<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="title desc">
<title id="title">6T SRAM transistor connectivity</title><desc id="desc">PMOS P1 and NMOS N1 share gate QB and drive Q. PMOS P2 and NMOS N2 share gate Q and drive QB. Access NMOS AX1 connects BL to Q and AX2 connects QB to BLB; both gates connect WL. PMOS to VDD and NMOS to VSS; body terminals omitted.</desc>
