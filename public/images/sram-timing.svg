<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 265" role="img" aria-labelledby="title">
<title id="title">Conceptual SRAM read and write phases, not voltage simulation</title><style>text{fill:#e6f2ff;font:16px Consolas,monospace}.muted{fill:#a9bed7;font-size:13px}.wave{stroke:#55dcf1;stroke-width:2.5;fill:none}.guide{stroke:#3a506c;stroke-dasharray:4 4}</style><text x="10" y="20">READ: Q=0</text><text class="muted" x="155" y="20">precharge → develop → sense</text><text x="10" y="55">PCH enable</text><path d="M150 37H280V59H702.5V37H800" fill="none" stroke="#55dcf1" stroke-width="2.5"/><text x="10" y="97">WL (read)</text><path d="M150 101H345V79H670V101H800" fill="none" stroke="#55dcf1" stroke-width="2.5"/><text x="10" y="137">BL / BLB</text><path d="M150 119H345L540 135H702.5V119H800M150 116H800" stroke="#55dcf1" stroke-width="2" fill="none"/><text class="muted" x="545" y="154">sense differential</text><text x="10" y="182">WRITE Q←0</text><text class="muted" x="190" y="182">drive BL=0, BLB=1 before WL↑; release after WL↓</text><text x="10" y="218">Write drive</text><path d="M150 222H280V200H735V222H800" fill="none" stroke="#55dcf1" stroke-width="2.5"/><text x="10" y="256">WL (write)</text><path d="M150 260H345V238H670V260H800" fill="none" stroke="#55dcf1" stroke-width="2.5"/></svg>