name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Install locked dependencies
        run: npm ci
      - name: Check educational logic and course structure
        run: |
          npm test
          npm run check:content
      - name: Resolve GitHub Pages base
        id: base
        run: echo "path=$(node scripts/pages-base.mjs)" >> "$GITHUB_OUTPUT"
      - name: Build public static SPA without notes
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build -- --base "$BASE_PATH"
      - name: Verify static assets under Pages base
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run check:build -- "$BASE_PATH"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
